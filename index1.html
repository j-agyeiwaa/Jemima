<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="card">
        <div class="img">
            <img src="images/jemima.jpeg" alt="Jemima Agyeiwaa Obeng-Amoako">
        </div>
        <div class="headings">
            <h1>Jemima Agyeiwaa Obeng-Amoako</h1>
            <p>I'm Jemima Agyeiwaa Obeng-Amoako, a second year BSc. Computer Science student at the Kwame Nkrumah University of Science and Technology. I enjoy learning new things and building stuff that solve problems</p>
        </div>
        <div class="skill-section">
            <div class="skill-badges">
                <span class="skill-badge">HTML & CSS</span>
                <span class="skill-badge">UI/UX Design</span>
                <span class="skill-badge">Python</span>
                <span class="skill-badge">Data Analysis</span>
            </div>
        </div>
        <div class="btn">
            <button>Contact Me</button>
        </div>
    </div>
</body>
</html>
